name: CI and Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Regenerate visual baselines in the CI container and upload them as an artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Same Playwright release as package.json, so Chromium and SwiftShader match the baselines.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      CI: 'true'
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - name: E2E (served from /horse-racing/)
        run: npm run test:e2e
      - name: Visual regression
        if: ${{ !inputs.update_baselines }}
        run: npm run test:visual
      - name: Regenerate visual baselines
        if: ${{ inputs.update_baselines }}
        run: npm run test:visual:update
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.update_baselines }}
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      # The exact build that passed the tests is what gets deployed.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
